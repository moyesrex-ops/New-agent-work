<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1240" viewBox="0 0 1180 1240">
  <defs>
    <path id="sPath" d="M 72.6 47 A 13.2 13.2 0 1 0 60 60 A 13.2 13.2 0 1 1 47.4 73"/>
    <mask id="sKnock">
      <rect width="120" height="120" fill="#fff"/>
      <use href="#sPath" fill="none" stroke="#000" stroke-width="12.5" stroke-linecap="butt"/>
    </mask>
    <mask id="perfBig">
      <rect x="6" y="6" width="108" height="108" rx="8" fill="#fff"/>
      <g fill="#000">
        <circle cx="24" cy="6"  r="7.5"/><circle cx="60" cy="6"  r="7.5"/><circle cx="96" cy="6"  r="7.5"/>
        <circle cx="24" cy="114" r="7.5"/><circle cx="60" cy="114" r="7.5"/><circle cx="96" cy="114" r="7.5"/>
        <circle cx="6"  cy="24" r="7.5"/><circle cx="6"  cy="60" r="7.5"/><circle cx="6"  cy="96" r="7.5"/>
        <circle cx="114" cy="24" r="7.5"/><circle cx="114" cy="60" r="7.5"/><circle cx="114" cy="96" r="7.5"/>
      </g>
    </mask>

    <symbol id="m0" viewBox="0 0 120 120"><g mask="url(#sKnock)"><rect x="6" y="6" width="108" height="108" rx="8" fill="currentColor" mask="url(#perfBig)"/></g></symbol>
    <symbol id="m5" viewBox="0 0 120 120"><g transform="rotate(-5 60 60)"><g mask="url(#sKnock)"><rect x="6" y="6" width="108" height="108" rx="8" fill="currentColor" mask="url(#perfBig)"/></g></g></symbol>
    <symbol id="m8" viewBox="0 0 120 120"><g transform="rotate(-8 60 60)"><g mask="url(#sKnock)"><rect x="6" y="6" width="108" height="108" rx="8" fill="currentColor" mask="url(#perfBig)"/></g></g></symbol>
    <!-- simplified small-size mark: perforations dropped, corners kept -->
    <symbol id="mSmall" viewBox="0 0 120 120"><g transform="rotate(-8 60 60)"><g mask="url(#sKnock)"><rect x="8" y="8" width="104" height="104" rx="14" fill="currentColor"/></g></g></symbol>
  </defs>

  <rect width="1180" height="1240" fill="#FBF9F4"/>

  <g font-family="Archivo" font-size="13" fill="#6B6675" letter-spacing="1.4">
    <text x="40"  y="40">0 DEGREES</text><text x="400" y="40">5 DEGREES</text><text x="760" y="40">8 DEGREES</text>
  </g>
