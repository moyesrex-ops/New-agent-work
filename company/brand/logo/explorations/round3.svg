    <text x="476" y="41" text-anchor="end" font-family="Archivo" font-size="11" fill="#6B6675">TAX INVOICE</text>
    <line x1="24" y1="66" x2="476" y2="66" stroke="#E3DED4"/>

    <text x="24" y="92"  font-family="Archivo" font-size="10.5" fill="#6B6675" letter-spacing="0.8">FROM</text>
    <text x="24" y="110" font-family="Archivo" font-weight="600" font-size="14" fill="#14121A">Emeka Aluminium Works Ltd</text>
    <text x="24" y="128" font-family="IBM Plex Mono" font-size="11" fill="#6B6675">TIN 20481166-0001</text>
    <text x="270" y="92"  font-family="Archivo" font-size="10.5" fill="#6B6675" letter-spacing="0.8">TO</text>
    <text x="270" y="110" font-family="Archivo" font-weight="600" font-size="14" fill="#14121A">Agbara Foods Plc</text>
    <text x="270" y="128" font-family="IBM Plex Mono" font-size="11" fill="#6B6675">TIN 10229384-0001</text>

    <line x1="24" y1="146" x2="476" y2="146" stroke="#F0EDE6"/>
    <text x="24" y="170" font-family="Archivo" font-size="13" fill="#14121A">Aluminium railings, 42 units</text>
    <text x="476" y="170" text-anchor="end" font-family="IBM Plex Mono" font-size="13" fill="#14121A">1,721,000.00</text>
    <text x="24" y="192" font-family="Archivo" font-size="13" fill="#6B6675">VAT 7.5%</text>
    <text x="476" y="192" text-anchor="end" font-family="IBM Plex Mono" font-size="13" fill="#6B6675">129,075.00</text>
    <line x1="300" y1="206" x2="476" y2="206" stroke="#14121A" stroke-width="1.2"/>
    <text x="300" y="230" font-family="Archivo" font-weight="600" font-size="15" fill="#14121A">Total</text>
    <text x="476" y="230" text-anchor="end" font-family="IBM Plex Mono" font-size="16" fill="#14121A">NGN 1,850,075.00</text>

