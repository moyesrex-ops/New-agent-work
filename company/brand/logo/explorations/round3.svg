  <text x="516" y="980" font-family="Archivo" font-weight="600" font-size="14" fill="#FBF9F4">Ibrahim Sule</text>
  <text x="516" y="998" font-family="IBM Plex Mono" font-size="10" fill="#9A94A5">AGENT 0114</text>
  <text x="458" y="1032" font-family="Archivo" font-size="9.5" fill="#9A94A5">Stampa is free for suppliers. Never pay an agent.</text>

  <circle cx="740" cy="960" r="24" fill="#4C2A85"/>
