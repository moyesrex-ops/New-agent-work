        <g color="#4C2A85"><use href="#m0" x="9" y="18" width="44" height="44"/></g>
        <text x="62" y="34" font-family="Archivo" font-weight="700" font-size="15" fill="#4C2A85" letter-spacing="1.2">STAMPED</text>
        <text x="62" y="50" font-family="IBM Plex Mono" font-size="10.5" fill="#4C2A85">IRN-7K2M-88QX-2026</text>
        <text x="62" y="64" font-family="IBM Plex Mono" font-size="9" fill="#6B6675">14 SEP 2026 10:42 WAT</text>
      </g>
    </g>
    <rect x="404" y="230" width="72" height="72" fill="#14121A"/>
    <rect x="410" y="236" width="60" height="60" fill="#fff"/>
    <g fill="#14121A">
      <rect x="414" y="240" width="16" height="16"/><rect x="450" y="240" width="16" height="16"/><rect x="414" y="276" width="16" height="16"/>
      <rect x="436" y="262" width="8" height="8"/><rect x="450" y="276" width="8" height="8"/><rect x="462" y="262" width="8" height="8"/><rect x="436" y="240" width="6" height="6"/>
    </g>
    <text x="476" y="314" text-anchor="end" font-family="Archivo" font-size="9" fill="#9A94A5">Verify at nrs.gov.ng</text>
  </g>

