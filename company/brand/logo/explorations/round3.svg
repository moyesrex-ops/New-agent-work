    <use href="#m5" x="400" y="58" width="170" height="170"/>
    <use href="#m8" x="760" y="58" width="170" height="170"/>
  </g>

  <text x="40" y="272" font-family="Archivo" font-size="11" fill="#9A94A5">horizontal lockup, each angle</text>
  <g color="#14121A">
    <use href="#m0" x="40"  y="288" width="56" height="56"/><text x="110" y="331" font-family="Archivo" font-weight="600" font-size="44" fill="#14121A" letter-spacing="-1.6">Stampa</text>
    <use href="#m5" x="400" y="288" width="56" height="56"/><text x="470" y="331" font-family="Archivo" font-weight="600" font-size="44" fill="#14121A" letter-spacing="-1.6">Stampa</text>
    <use href="#m8" x="760" y="288" width="56" height="56"/><text x="830" y="331" font-family="Archivo" font-weight="600" font-size="44" fill="#14121A" letter-spacing="-1.6">Stampa</text>
  </g>

  <text x="40" y="392" font-family="Archivo" font-size="11" fill="#9A94A5">full mark vs simplified small mark, at 32 / 24 / 20 / 16 px</text>
  <g color="#14121A">
    <use href="#m8" x="40" y="404" width="32" height="32"/><use href="#m8" x="84" y="412" width="24" height="24"/><use href="#m8" x="120" y="416" width="20" height="20"/><use href="#m8" x="152" y="420" width="16" height="16"/>
    <text x="185" y="428" font-family="Archivo" font-size="11" fill="#9A94A5">full mark (perforations mush below 24)</text>
    <use href="#mSmall" x="40" y="452" width="32" height="32"/><use href="#mSmall" x="84" y="460" width="24" height="24"/><use href="#mSmall" x="120" y="464" width="20" height="20"/><use href="#mSmall" x="152" y="468" width="16" height="16"/>
    <text x="185" y="476" font-family="Archivo" font-size="11" fill="#9A94A5">simplified mark for 16-24px, favicon, notification icon</text>
  </g>

